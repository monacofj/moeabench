name: DTLZ6 original five selected support-obstruction diagnosis (issue 175)

on:
  pull_request:
    paths:
      - "scripts/audit/dtlz6_tight_irrational_pf.py"
      - "scripts/audit/dtlz6_tight_selected_source.py"
      - "scripts/audit/dtlz6_selected_support_obstruction.py"
      - "tests/unit/test_gt_dtlz6_selected_support_obstruction_issue175.py"
      - ".github/workflows/gt-dtlz6-selected-obstruction-175.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-selected-inconclusive-diagnosis:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - name: Test diagnostic abstention and faithful historical classification
        run: python -m pytest tests/unit/test_gt_dtlz6_selected_support_obstruction_issue175.py -q
      - name: Regenerate unchanged original DTLZ6 sixteen-point PS/F
        run: |
          python -m scripts.audit.dtlz56_final_selected_small_gt \
            --problem DTLZ6 --m 4 --k 1 --points 16 \
            --bundle dtlz6-original-n16-diagnostic-paired.npz \
            --report dtlz6-original-n16-diagnostic-source.json
      - name: Diagnose all five original source support obstructions
        run: |
          python -m scripts.audit.dtlz6_selected_support_obstruction \
            --paired-bundle dtlz6-original-n16-diagnostic-paired.npz \
            --report dtlz6-original-n16-support-obstruction.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path(
              "dtlz6-original-n16-support-obstruction.json"
          ).read_text())
          assert r["selected_count"]==16
          assert r["original_historical_inconclusive_indices"]==[6,7,10,11,12]
          assert r["scientific_certification"]=="unverified"
          assert r["whole_pf_completeness"]=="unverified"
          assert len(r["row_diagnostics"])==5
          print("Obstruction counts:")
          for label in sorted(set(x["reason"] for x in r["row_diagnostics"])):
              print(label,sum(x["reason"]==label for x in r["row_diagnostics"]))
          PY
      - name: Archive exact source and obstruction report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtlz6-original-selected-five-support-obstructions
          path: |
            dtlz6-original-n16-diagnostic-paired.npz
            dtlz6-original-n16-diagnostic-source.json
            dtlz6-original-n16-support-obstruction.json
          if-no-files-found: warn
