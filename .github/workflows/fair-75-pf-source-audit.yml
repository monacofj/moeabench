# Temporary scientific PF-source audit workflow for issue #75; remove after evidence.
name: FAIR issue 75 independent PF source validity audit

on:
  push:
    branches: [fix/75-fair-core]
  workflow_dispatch:

jobs:
  fourteen-mop-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - name: Install exact core branch package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Test audit conservatism and source status invariants
        run: python -m pytest -q tests/unit/test_audit_pf_sources_issue75.py
      - name: Audit all actual 14 MOP source samplers against frozen GT
        timeout-minutes: 10
        run: |
          python calibration/scripts/audit_pf_sources_issue75.py \
            --points 1024 --output /tmp/fair-75-pf-source-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("/tmp/fair-75-pf-source-audit.json").read_text())
          assert j["status"]=="NONCERTIFIED_PF_SOURCE_AUDIT_NEVER_BASELINE_CERTIFICATION"
          assert j["MOP_count"]==14 and len(j["problems"])==14
          assert j["no_baseline_modified"]
          assert set(j["summary"]["unsupported"])=={"DPF3","DTLZ8"}
          assert j["summary"]["independent_analytical_sources"]==12
          assert j["problems"]["DPF5"]["DPF5_branch"] is not None
          assert not j["problems"]["DPF5"]["normative_probability_law_approved"]
          assert all(x["review_status"].startswith(("CONDITIONAL","HOLD","NO_"))
                     for x in j["problems"].values())
          print("VALIDATED AUDIT SUMMARY:",j["summary"])
          PY
      - name: Run entire unit suite
        timeout-minutes: 5
        run: python test.py --unit
      - name: Ensure official files remain untouched
        run: |
          git diff --exit-code -- \
            moeabench/diagnostics/resources/baselines_v0.14.0.json \
            calibration/audit_report.html
      - name: Save noncertified per-MOP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fair-75-fourteen-mop-pf-source-audit-not-certified
          path: /tmp/fair-75-pf-source-audit.json
          if-no-files-found: warn
