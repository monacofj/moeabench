name: "Issue 108 - Validate frozen performance study constructors"

on:
  push:
    branches:
      - architecture/108-certification-protocol

jobs:
  study-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NPY_DISABLE_CPU_FEATURES: X86_V4
      OPENBLAS_CORETYPE: HASWELL
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - name: Install approved numerical libraries
        run: |
          python -m pip install -e . pytest
          python -m pip install "numpy==2.5.4" "scipy==1.18.1" "pymoo==0.6.2" "deap==1.4.4" "moocore==0.3.2" "pandas==3.0.6" threadpoolctl
      - name: Verify actual reference NumPy and OpenBLAS kernels
        run: python scripts/check_numerical_reference_runtime.py
      - name: Probe six constructors, frozen front generation and IGD+
        run: |
          python - <<'PY'
          import json
          import time
          import numpy as np
          import moeabench as mb
          cases = [
              ("dtlz2-nsga2", "DTLZ2", {"M": 3}, "NSGA2"),
              ("dtlz2-nsga3", "DTLZ2", {"M": 3}, "NSGA3"),
              ("dtlz2-moead", "DTLZ2", {"M": 3}, "MOEAD"),
              ("dtlz7-nsga2", "DTLZ7", {"M": 3}, "NSGA2"),
              ("dtlz7-nsga3", "DTLZ7", {"M": 3}, "NSGA3"),
              ("dpf1-nsga3", "DPF1", {"M": 3, "D": 2}, "NSGA3"),
          ]
          for id_, mopname, kwargs, moeaname in cases:
              mop = getattr(mb.mops, mopname)(**kwargs)
              ref = np.asarray(mop.pf(n_points=512), dtype=float)
              assert ref.shape == (512, 3) and np.isfinite(ref).all(), (id_, ref.shape)
              results = []
              for i in range(2):
                  seed = 424242 + 104729*i
                  alg = getattr(mb.moeas, moeaname)(population=48, generations=3, seed=seed)
                  exp = mb.experiment(mop=mop, moea=alg)
                  start = time.monotonic()
                  exp.run(repeat=1, silent=True)
                  nd = np.asarray(exp.front(), dtype=float)
                  igdplus = float(mb.metrics.igdplus(nd, ref=ref, progress=False))
                  assert np.isfinite(igdplus) and igdplus >= 0 and nd.ndim == 2
                  results.append({"seed":seed, "igdplus":igdplus, "front_size":len(nd), "seconds":round(time.monotonic()-start,3)})
              print("ISSUE108_CASE "+json.dumps({"case":id_, "reference_shape":list(ref.shape), "observations":results}, sort_keys=True), flush=True)
          PY
