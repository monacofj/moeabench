name: DTLZ6 tighter exact irrational-root Taylor membership (issue 175)

on:
  pull_request:
    paths:
      - "scripts/audit/dtlz6_tight_irrational_pf.py"
      - "scripts/audit/dtlz6_tight_selected_source.py"
      - "tests/unit/test_gt_dtlz6_tight_irrational_pf_issue175.py"
      - ".github/workflows/gt-dtlz6-taylor-root-175.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-taylor-support:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - name: Independently verify sharper Taylor exact irrational root proofs
        run: python -m pytest tests/unit/test_gt_dtlz6_tight_irrational_pf_issue175.py -q
      - name: Assert precise positive result and incomplete global acceptance
        run: |
          python - <<'PY'
          from fractions import Fraction
          from scripts.audit.dtlz6_tight_irrational_pf import (
              certify_dtlz6_tight_radial_pf,replay_dtlz6_tight_radial_pf)
          positions=(Fraction(1,8),Fraction(1),Fraction(0))
          tail=(Fraction(1,3),)
          r=certify_dtlz6_tight_radial_pf(positions,tail,k=1)
          assert replay_dtlz6_tight_radial_pf(positions,tail,r,k=1)
          assert r["scientific_certification"]=="unverified"
          assert r["whole_gt_coverage"]=="unverified"
          print("Positive exact DTLZ6 irrational-root Taylor support replay")
          PY
