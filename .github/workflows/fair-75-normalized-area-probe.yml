# Temporary focused scientific check for issue #75.
# Delete before merging the investigation PR into main.
name: FAIR 75 normalized-area scientific probe

on:
  push:
    branches:
      - fix/75-fair-conformance
    paths:
      - 'calibration/scripts/independent_pf_sources_issue75.py'
      - 'calibration/scripts/study_cross_sampler_moea_issue75.py'
      - 'tests/unit/test_independent_pf_sources_issue75.py'
      - 'tests/unit/test_cross_sampler_moea_issue75.py'
      - 'tests/unit/test_verify_closeness_migration_issue75.py'
      - 'calibration/scripts/migrate_closeness_residue.py'
      - 'calibration/scripts/verify_closeness_migration.py'
      - '.github/workflows/fair-75-normalized-area-probe.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'calibration/scripts/independent_pf_sources_issue75.py'
      - 'calibration/scripts/study_cross_sampler_moea_issue75.py'
      - 'tests/unit/test_independent_pf_sources_issue75.py'
      - 'tests/unit/test_cross_sampler_moea_issue75.py'
      - 'tests/unit/test_verify_closeness_migration_issue75.py'
      - 'calibration/scripts/migrate_closeness_residue.py'
      - 'calibration/scripts/verify_closeness_migration.py'
      - '.github/workflows/fair-75-normalized-area-probe.yml'
  workflow_dispatch:

jobs:
  independent-geometry-and-real-fronts:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - name: Install numerical and MOEA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Check independent analytical reference laws and comparison guards
        run: |
          python -m pytest -q -s \
            tests/unit/test_independent_pf_sources_issue75.py \
            tests/unit/test_cross_sampler_moea_issue75.py \
            tests/unit/test_verify_closeness_migration_issue75.py
      - name: Measure DTLZ2 raw-area vs normalized-area impact on real NSGA-II
        timeout-minutes: 11
        run: |
          python calibration/scripts/study_cross_sampler_moea_issue75.py \
            --problem DTLZ2 \
            --moea-seed 1 --moea-seed 7 \
            --ideal-seed 123 --ideal-seed 124 \
            --ideal-seed 125 --ideal-seed 126 \
            --population 40 --generations 90 \
            --output /tmp/fair-75-dtlz2-normalized-area-q.json
      - name: Require nondegenerate science evidence and unchanged frozen baseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/fair-75-dtlz2-normalized-area-q.json").read_text())
          assert not payload["failures"], payload["failures"]
          data = payload["results"]["DTLZ2"]
          comparison = data["raw_vs_normalized_area_DTLZ2"]
          assert comparison["not_certified"]
          assert comparison["nonclipped_fronts"] >= 1, comparison
          assert comparison["max_nonclipped_q_shift"] is not None
          assert comparison["max_nonclipped_within_law_seed_span"] is not None
          assert len(comparison["per_front"]) == 6
          assert data["normalization"]["max_span_over_min_span"] > 1
          assert data["normalization"]["max_span_over_min_span"] < 1.01
          assert len([k for k in data["samples"] if k.startswith("normalized_area_")]) == 4
          print("NONCERTIFIED DTLZ2 raw-vs-normalized area:", {
              k: v for k, v in comparison.items() if k != "per_front"
          })
          print("No baseline write requested by the study: PASS")
          PY
          # Read-only intent is checked against the actual Git worktree:
          # fail if the experiment changed any frozen reference or report.
          git diff --exit-code -- \
            moeabench/diagnostics/resources/baselines_v0.14.0.json \
            moeabench/diagnostics/resources/references/DTLZ2/calibration_package.npz \
            calibration/audit_report.html
          echo "Frozen reference/report files unchanged: PASS"
      - name: Stage normalized-area baselines for DTLZ1 and DTLZ2 only
        timeout-minutes: 10
        run: |
          python calibration/scripts/migrate_closeness_residue.py \
            --reference-law normalized_objective_area \
            --problem DTLZ1 --problem DTLZ2 \
            --sample-size 4096 --sampling-seed 123 \
            --output /tmp/fair-75-area-candidate.json \
            --impact-report /tmp/fair-75-area-impact.json \
            > /tmp/fair-75-area-migration-log.txt
          python calibration/scripts/verify_closeness_migration.py \
            --original moeabench/diagnostics/resources/baselines_v0.14.0.json \
            --candidate /tmp/fair-75-area-candidate.json \
            --problem DTLZ1 --problem DTLZ2 \
            --output /tmp/fair-75-area-verification.json
          python - <<'PY'
          import json
          from pathlib import Path
          impact=json.loads(Path('/tmp/fair-75-area-impact.json').read_text())
          verified=json.loads(Path('/tmp/fair-75-area-verification.json').read_text())
          assert not impact['failed'], impact['failed']
          assert impact['reference_law']=='normalized_objective_area'
          assert impact['status']=='NONCERTIFIED_CANDIDATE'
          assert verified['status']=='PASS_PROVISIONAL_CLOSENESS_ONLY'
          assert verified['k_counts']=={'DTLZ1':44,'DTLZ2':44}
          assert verified['untouched_problem_count']==12
          for name in ('DTLZ1','DTLZ2'):
              provenance=impact['problems'][name]['ideal_sample_provenance']
              assert provenance['seed']==123
              assert provenance['n_fresh']>=4000
              assert provenance['target_measure']=='uniform_intrinsic_area_normalized_objective_pf'
          print('AREA CANDIDATE: 88 K records verified, 12 other MOPs unchanged')
          PY
      - name: Upload provisional area-baseline migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fair-75-dtlz1-dtlz2-normalized-area-migration
          path: |
            /tmp/fair-75-area-impact.json
            /tmp/fair-75-area-verification.json
            /tmp/fair-75-area-migration-log.txt
          if-no-files-found: warn
      - name: Upload prospective normalized-area study (not a certified baseline)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fair-75-dtlz2-normalized-area-probe
          path: /tmp/fair-75-dtlz2-normalized-area-q.json
          if-no-files-found: warn
