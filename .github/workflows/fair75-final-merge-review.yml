# Temporary pre-merge check; remove after successful run.
name: FAIR issue75 core final merge review

on:
  push:
    branches: [fix/75-fair-core]
  workflow_dispatch:

jobs:
  final-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - name: Install MoeaBench and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Test updated current-PF and frozen-GT distinction
        run: |
          python -m pytest -q \
            tests/unit/test_audit_pf_sources_issue75.py \
            tests/unit/test_stage_closeness_adr0037.py \
            tests/unit/test_dtlz7_dpf2_pareto_sources_issue78.py \
            tests/unit/test_fair_conformance_issue75.py \
            tests/unit/test_headway_anchors_issue75.py \
            tests/integration/test_example13_consistency.py
      - name: Audit all fourteen MOP sources after issue79 merge
        timeout-minutes: 8
        run: |
          python calibration/scripts/audit_pf_sources_issue75.py \
            --points 1024 --output /tmp/fair75-post79-pf-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/fair75-post79-pf-audit.json').read_text())
          assert d['MOP_count']==14
          assert d['status']=='NONCERTIFIED_PF_SOURCE_AUDIT_NEVER_BASELINE_CERTIFICATION'
          for p in ('DPF2','DTLZ7'):
              r=d['problems'][p]
              assert r['source_repaired_in_issue78'] is True
              assert r['frozen_GT_has_independently_demonstrated_dominated_points'] is True
              assert r['sampled_pf']['within_sample_dominated']==0
              assert r['review_status']=='HOLD_ARCHIVED_GT_INVALID_WITH_CORRECTED_SOURCE'
              print(p, 'corrected sampler ND',r['sampled_pf']['within_sample_nondominated_fraction'])
          PY
      - name: Verify existing ADR0037 preview never promotes held MOPs
        timeout-minutes: 7
        run: |
          python calibration/scripts/stage_closeness_adr0037.py \
            --impact /tmp/fair75-final-impact.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('/tmp/fair75-final-impact.json').read_text())
          assert j['status']=='PROVISIONAL_ADR0037_INDEPENDENT_MOP_PF_NOT_CERTIFIED'
          assert j['K_records_changed']==396
          assert set(j['unsupported'])=={'DPF2','DPF3','DPF5','DTLZ7','DTLZ8'}
          assert j['verification']['K_records_checked']==396
          print('396 noncertified Closeness records only, 5 MOPs excluded')
          PY
      - name: Full unit battery
        run: python test.py --unit
      - name: Generate genuine integration fixtures
        run: |
          python - <<'PY'
          import moeabench as mb
          from pathlib import Path
          for algorithm, filename in [
              (mb.moeas.NSGA2,'example_full_exp1.zip'),
              (mb.moeas.NSGA3,'example_full_exp2.zip'),
          ]:
              exp=mb.experiment(mop=mb.mops.DTLZ2(M=3),
                                moea=algorithm(population=32,generations=8,seed=17))
              exp.run(repeat=3,silent=True)
              exp.save(str(Path('examples')/filename))
          PY
      - name: Basic integration battery
        run: python test.py --integration --basic
      - name: Confirm canonical artifacts unchanged
        run: |
          git diff --exit-code -- \
            moeabench/diagnostics/resources/baselines_v0.14.0.json \
            moeabench/diagnostics/resources/references \
            calibration/audit_report.html
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fair75-final-code-merge-evidence
          path: |
            /tmp/fair75-post79-pf-audit.json
            /tmp/fair75-final-impact.json
          if-no-files-found: warn
