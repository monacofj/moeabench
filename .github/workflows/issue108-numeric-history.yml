name: "Issue 108 - compact historical numeric certification"
on:
  push:
    branches: [feat/108-certification-lifecycle]
jobs:
  numeric-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NPY_DISABLE_CPU_FEATURES: X86_V4
      OPENBLAS_CORETYPE: HASWELL
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with: {path: tooling}
      - uses: actions/checkout@v4
        with:
          ref: 0d3e66804351e23b93fb483ff25e178e06ef6e12
          path: source
      - name: Add certification instrument only; keep original numerical/solver code
        run: |
          cp tooling/moeabench/certification.py source/moeabench/certification.py
          cp tooling/test.py source/test.py
          cd source
          git diff --exit-code -- moeabench/core moeabench/moeas moeabench/mops moeabench/metrics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - name: Install exact certified reference stack
        working-directory: source
        run: |
          python -m pip install -e . pytest
          python -m pip install "numpy==2.5.4" "scipy==1.18.1" "pymoo==0.6.2" "deap==1.4.4" "moocore==0.3.2" "pandas==3.0.6" threadpoolctl
      - name: Generate the existing integration example archives
        working-directory: source
        run: |
          python - <<'PY'
          from pathlib import Path
          import moeabench as mb
          for cls, filename in ((mb.moeas.NSGA2,"example_full_exp1.zip"),(mb.moeas.NSGA3,"example_full_exp2.zip")):
              path=Path("examples")/filename
              if path.exists(): continue
              exp=mb.experiment(mop=mb.mops.DTLZ2(M=3),moea=cls(population=32,generations=8,seed=17))
              exp.run(repeat=3,silent=True)
              exp.save(str(path))
          PY
      - name: Run new --certify-numeric gate and register compact history
        working-directory: source
        run: python test.py --certify-numeric
      - name: Audit generated certificate and expose its exact JSON
        working-directory: source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("moeabench/resources/certifications/0.18.0/numeric-certificate.json")
          obj=json.loads(p.read_text())
          assert obj["version"]=="0.18.0"
          assert obj["source_revision"]=="0d3e66804351e23b93fb483ff25e178e06ef6e12"
          assert obj["environment"]["moeabench"]=="0.18.0"
          assert len(obj["numerical_fixtures_sha256"])==3
          assert obj["counts"]=={"suite":"basic","status":"PASSED"}
          print("ISSUE108_NUMERIC_CERT_BEGIN",flush=True)
          print(p.read_text().rstrip(),flush=True)
          print("ISSUE108_NUMERIC_CERT_END",flush=True)
          PY
      - name: Upload actual numeric certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue108-numeric-certificate-0180
          path: source/moeabench/resources/certifications/0.18.0/numeric-certificate.json
          if-no-files-found: warn
