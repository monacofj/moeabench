name: Issue 119 post-fix quantitative GT audit

on:
  pull_request:
    paths:
      - ".github/workflows/gt-postfix-issue119.yml"
      - "scripts/audit/gt_postfix_quantitative_issue119.py"
      - "scripts/audit/gt_independent_probes_issue119.py"
      - "scripts/audit/gt_reference_sensitivity_issue119.py"
      - "scripts/audit/gt_independent_geometry_issue119.py"
      - "tests/unit/test_gt_postfix_quantitative_issue119.py"
      - "tests/unit/test_gt_independent_probes_issue119.py"
      - "tests/unit/test_gt_reference_sensitivity_issue119.py"
      - "tests/unit/test_gt_independent_geometry_issue119.py"
      - "docs/research/gt-issue119/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postfix-gt-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and scientific test dependencies
        run: python -m pip install -e . pytest
      - name: Independently verify report invariants
        run: |
          python -m pytest -q tests/unit/test_gt_postfix_quantitative_issue119.py \
            tests/unit/test_gt_independent_probes_issue119.py \
            tests/unit/test_gt_reference_sensitivity_issue119.py \
            tests/unit/test_gt_independent_geometry_issue119.py
      - name: Collect all 12 MOPs at 128, 512 and historical GT budgets
        run: |
          python -m scripts.audit.gt_postfix_quantitative_issue119 \
            --objectives 3 5 \
            --budgets 128 512 \
            --large-budget > gt-postfix-quantitative.json
          python - <<'PY'
          import json
          a = json.load(open("gt-postfix-quantitative.json"))
          assert a["schema"] == "moeabench_issue119_postfix_finite_gt_v1"
          assert len(a["records"]) == 72, len(a["records"])
          for r in a["records"]:
              assert r["ps_reproducible"], r
              assert r["budget_actual"] == r["budget_requested"], r
              assert r["unique_objectives"] == r["budget_requested"], r
              if r["geometry_residual"] is not None:
                  assert r["geometry_residual"] < 1e-10, r
              if r["region_occupancy"] is not None:
                  assert r["region_occupancy"]["invalid_record_rows"] == 0, r
              print("MOP_GT_AUDIT", r["problem"], "M", r["M"],
                    "requested", r["budget_requested"],
                    "unique", r["unique_objectives"],
                    "elapsed_s", round(r["elapsed_seconds"], 5),
                    "geometry_residual", r["geometry_residual"])
          PY
      - name: Collect independent finite-probe covering diagnostics
        run: |
          python -m scripts.audit.gt_independent_probes_issue119 \
            --objectives 3 5 --budgets 128 512 \
            --seeds 11941 11942 11943 \
            --probes 512 > gt-postfix-finite-probes.json
          python - <<'PY'
          import json
          records = json.load(open("gt-postfix-finite-probes.json"))["results"]
          assert len(records) == 96, len(records)
          assert all(not r["certified_continuous_bound"] for r in records)
          for r in records:
              assert r["finite_max_gap"] >= r["finite_mean_gap"] >= 0
              print("INDEPENDENT_GT_GAP", r["problem"], "M", r["M"],
                    "budget", r["budget"], "seed", r["seed"],
                    "max", round(r["finite_max_gap"], 6),
                    "mean", round(r["finite_mean_gap"], 6))
          PY
      - name: Measure finite-reference IGD and IGD+ sensitivity
        run: |
          python -m scripts.audit.gt_reference_sensitivity_issue119 \
            --objectives 3 5 --budgets 128 512 2000 \
            --seeds 11941 11942 11943 \
            --population 64 > gt-reference-sensitivity.json
          python - <<'PY'
          import json
          records = json.load(open("gt-reference-sensitivity.json"))["records"]
          assert len(records) == 48, len(records)
          for record in records:
              scores = record["reference_scores"]
              assert len(scores) == 3
              assert all(s["raw_igd"] >= s["raw_igd_plus"] >= 0
                         for s in scores)
              first, last = scores[0], scores[-1]
              print("GT_REFERENCE_SENSITIVITY", record["problem"],
                    "M", record["M"], "seed", record["population_seed"],
                    "IGD_128", round(first["raw_igd"], 6),
                    "IGD_largest", round(last["raw_igd"], 6),
                    "IGDPLUS_128", round(first["raw_igd_plus"], 6),
                    "IGDPLUS_largest", round(last["raw_igd_plus"], 6))
          PY
      - name: Independent DTLZ8 and DPF3-5 geometry and component coverage
        run: |
          python -m scripts.audit.gt_independent_geometry_issue119 \
            --objectives 3 5 --budgets 128 512 \
            --seeds 11941 11942 11943 --probes 128 \
            > gt-independent-geometry.json
          python - <<'PY'
          import json
          records=json.load(open("gt-independent-geometry.json"))["records"]
          assert len(records)==48, len(records)
          for r in records:
              assert all(v["maximum_gap"] >= v["mean_gap"] >= 0
                         for v in r["components"].values())
              if r["evaluator_residual"] is not None:
                  assert r["evaluator_residual"] < 1e-12, r
              for component,values in r["components"].items():
                  print("INDEPENDENT_GEOMETRY", r["problem"], "M",r["M"],
                        "n",r["budget"],"seed",r["seed"], component,
                        "max", round(values["maximum_gap"],6),
                        "mean",round(values["mean_gap"],6))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gt-postfix-quantitative-issue119
          path: |
            gt-postfix-quantitative.json
            gt-postfix-finite-probes.json
            gt-reference-sensitivity.json
            gt-independent-geometry.json
          retention-days: 30
