name: DTLZ8 independent component research (issue 119)

on:
  pull_request:
    paths:
      - ".github/workflows/gt-dtlz8-component-research-119.yml"
      - "scripts/audit/gt_dtlz8_candidate_issue119.py"
      - "scripts/audit/gt_dtlz8_component_comparison_issue119.py"
      - "scripts/audit/gt_dtlz8_membership_issue119.py"
      - "scripts/audit/gt_dtlz8_spacing_sensitivity_issue119.py"
      - "scripts/audit/gt_dtlz8_policy_issue119.py"
      - "tests/unit/test_gt_dtlz8_candidate_issue119.py"
      - "tests/unit/test_gt_dtlz8_component_comparison_issue119.py"
      - "tests/unit/test_gt_dtlz8_membership_issue119.py"
      - "tests/unit/test_gt_dtlz8_spacing_sensitivity_issue119.py"
      - "tests/unit/test_gt_dtlz8_policy_issue119.py"
      - "tests/unit/test_gt_dtlz8_hybrid_issue119.py"
      - "tests/unit/test_gt_dtlz8_decision_compatibility_issue119.py"
      - "docs/research/gt-issue119/gt-dtlz8-exact-budget-candidate.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dtlz8-component-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: python -m pip install -e . pytest
      - name: Validate new independent component checks
        run: |
          python -m pytest -q \
            tests/unit/test_gt_dtlz8_candidate_issue119.py \
            tests/unit/test_gt_dtlz8_component_comparison_issue119.py \
            tests/unit/test_gt_dtlz8_membership_issue119.py \
            tests/unit/test_gt_dtlz8_spacing_sensitivity_issue119.py \
            tests/unit/test_gt_dtlz8_policy_issue119.py \
            tests/unit/test_gt_dtlz8_hybrid_issue119.py \
            tests/unit/test_gt_dtlz8_decision_compatibility_issue119.py
      - name: Compare reference geometry component by component
        run: |
          python -m scripts.audit.gt_dtlz8_component_comparison_issue119 \
            --objectives 2 3 4 5 10 \
            --budgets 128 512 \
            --seeds 11941 11942 11943 \
            --probes 256 > dtlz8-component-comparison.json
          python - <<'PY'
          import json
          records = json.load(open("dtlz8-component-comparison.json"))["results"]
          for r in records:
              for component, pair in r["components"].items():
                  before = pair["incumbent"]["max_euclidean_gap"]
                  after = pair["candidate"]["max_euclidean_gap"]
                  lattice = pair["lattice"]["max_euclidean_gap"]
                  print("DTLZ8", r["M"], "budget", r["requested"],
                        "seed", r["probe_offset"], "component", component,
                        "incumbent_count", r["incumbent_count"],
                        "candidate_count", r["candidate_count"],
                        "observed_max_gap_before", round(before, 6),
                        "observed_max_gap_after", round(after, 6),
                        "lattice_max_gap", round(lattice, 6),
                        "m4_completion_max_gap",
                        (round(pair["m4_completion"]["max_euclidean_gap"], 6)
                         if "m4_completion" in pair else None))
          PY
      - name: Independently audit actual Pareto-front membership
        run: |
          python -m scripts.audit.gt_dtlz8_membership_issue119 \
            --objectives 2 3 4 5 10 \
            --budgets 128 512 2000 > dtlz8-membership.json
          python - <<'PY'
          import json
          for record in json.load(open("dtlz8-membership.json"))["records"]:
              for name, values in record["results"].items():
                  print("DTLZ8_MEMBERSHIP", record["M"], record["requested"],
                        name, "rows", values["count"], "unique", values["unique"],
                        "outside_tol", values["outside_tol"],
                        "max_residual", values["max_residual"],
                        "infeasible", values["constraint_violations_above_tol"],
                        "max_constraint_violation", values["max_constraint_violation"])
          PY
      - name: Audit per-component spatial regularity and indicator sensitivity
        run: |
          python -m scripts.audit.gt_dtlz8_spacing_sensitivity_issue119 \
            --objectives 2 3 4 5 10 \
            --budgets 128 512 \
            --seeds 11941 11942 11943 \
            --population-per-region 32 > dtlz8-spacing-igd-sensitivity.json
          python - <<'PY'
          import json
          records = json.load(open("dtlz8-spacing-igd-sensitivity.json"))["records"]
          for record in records:
              print("REFERENCE_SENSITIVITY",
                    "M", record["M"], "n", record["budget"],
                    "seed", record["probe_seed"])
              for ref, stats in record["reference_spacing"].items():
                  print("SPACING", ref, stats)
              for ref, scores in record["igd_plus_by_finite_reference_and_population"].items():
                  print("IGD_PLUS", ref, scores)
          PY
      - name: Verify historical 2000-point DTLZ8 M4 calibration budget
        run: |
          python -m scripts.audit.gt_dtlz8_component_comparison_issue119 \
            --objectives 4 --budgets 2000 \
            --seeds 11941 11942 11943 --probes 512 \
            > dtlz8-m4-canonical-2000.json
          python - <<'PY'
          import json
          records = json.load(open("dtlz8-m4-canonical-2000.json"))["results"]
          for r in records:
              assert r["m4_completion_count"] == 2000
              assert r["m4_completion_unique"] == 2000
              for region, comparisons in r["components"].items():
                  original = comparisons["incumbent"]["max_euclidean_gap"]
                  completed = comparisons["m4_completion"]["max_euclidean_gap"]
                  assert completed <= original + 1e-12, (region, original, completed)
                  print("M4_CANONICAL", r["probe_offset"], region,
                        "incumbent_unique", r["incumbent_unique"],
                        "final_unique", r["m4_completion_unique"],
                        "max_gap_old", round(original, 6),
                        "max_gap_new", round(completed, 6))
          PY
      - name: Audit all corrected DTLZ8 reference candidates at 2000 points
        run: |
          python -m scripts.audit.gt_dtlz8_policy_issue119 \
            --objectives 2 3 5 10 \
            --budgets 128 512 2000 \
            --offsets 11941 11942 11943 \
            --probes 512 > dtlz8-policy-candidates.json
          python - <<'PY'
          import json
          evidence = json.load(open("dtlz8-policy-candidates.json"))["results"]
          assert len(evidence) == 12
          for record in evidence:
              print("DTLZ8_POLICY", record["M"], record["requested"],
                    "incumbent_unique", record["incumbent_unique"],
                    "preference", record["finite_probe_max_gap_preference"],
                    "hybrid_vs_halton", record["hybrid_no_worse_than_halton"],
                    "hybrid_vs_lattice", record["hybrid_no_worse_than_lattice"])
              for name, metrics in record["per_component"].items():
                  print("POLICY_COMPONENT", record["M"], record["requested"],
                        name, "halton_worst_gap",
                        round(metrics["candidate"]["worst_max_gap"], 6),
                        "lattice_worst_gap",
                        round(metrics["lattice"]["worst_max_gap"], 6),
                        "hybrid_worst_gap",
                        round(metrics["hybrid"]["worst_max_gap"], 6))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dtlz8-component-research-119
          path: |
            dtlz8-component-comparison.json
            dtlz8-membership.json
            dtlz8-spacing-igd-sensitivity.json
            dtlz8-m4-canonical-2000.json
            dtlz8-policy-candidates.json
          retention-days: 30
