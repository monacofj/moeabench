name: Temporary issue 81 full-calibration real-Q research
on:
  push:
    branches: [research/81-dpf5-calibration-protocol]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e . pytest
      - run: python -m pytest tests/test_issue81_full_calibration_q.py -q
      - run: |
          python calibration/scripts/study_dpf5_real_q_full_calibrations_issue81.py \
            --K 100 --replicates 3 --generations 40 \
            --output /tmp/issue81-full-real-q.json
      - uses: actions/upload-artifact@v4
        with:
          name: issue81-full-calibration-real-q-pilot
          path: /tmp/issue81-full-real-q.json
