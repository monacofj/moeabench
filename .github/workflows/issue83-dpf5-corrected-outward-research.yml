# Temporary DPF5 scientific experiment, never used for production baseline.
name: DPF5 issue83 corrected outward null research-only

on:
  push:
    branches: [research/78-dpf5-measure-sensitivity]
  workflow_dispatch:

jobs:
  paired-dpf5:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - name: Install MoeaBench and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Verify corrected source is EXACT merged PR84 generator
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          source=Path("calibration/scripts/generate_baselines.py").read_bytes()
          assert b"dominance_outward_pca_direction" in source
          assert b"sign = rng.choice" not in source
          assert b"Half-normal sigma must be finite and positive" in source
          print("CORRECTED OUTWARD GENERATOR SHA256",hashlib.sha256(source).hexdigest())
          PY
      - name: Verify non-destructive DPF5 candidate assembly
        timeout-minutes: 4
        run: |
          python -m pytest -q \
            tests/unit/test_dpf5_outward_blur_issue83.py \
            tests/unit/test_dpf5_negative_ecdf_issue78.py \
            tests/unit/test_dpf5_independent_pf_issue78.py
      - name: Corrected half-blur 2s_K sigma and paired real NSGA-II trial
        timeout-minutes: 11
        run: |
          python calibration/scripts/study_dpf5_outward_blur_issue83.py \
            --K 100 --reference-n 16384 --reference-seed 123 \
            --generations 300 --seed 1 --seed 7 \
            --output /tmp/issue83-dpf5-corrected-outward-paired-q.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('/tmp/issue83-dpf5-corrected-outward-paired-q.json').read_text())
          assert j["status"]=="NONCERTIFIED_DPF5_CORRECTED_OUTWARD_BLUR_PAIRED_STUDY"
          assert j["GT_distinct_points"]==3367
          assert j["GT_distinct_P"]==3300 and j["GT_distinct_D"]==67
          assert j["null_anchors_identical_distinct_GT_rows"]
          assert j["all_blurs_strictly_dominated_by_parent"]
          assert abs(j["sigma_controller_observed_median_u"]-2)<.1
          assert abs(j["independent_final_blur_median_u"]-2)<.2
          assert j["independent_ideal_residue"]>0
          assert not j["null_weighting_revised"]
          assert not j["historical_GT_changed"]
          assert not j["baseline_files_changed"]
          assert j["all_other_fair_q_unchanged"] is True
          assert not j["certified"]
          assert len(j["paired_real_moea"])==2
          print("DPF5 corrected outward new sigma",j["new_sigma"])
          print("DPF5 archived sigma",j["original_sigma"])
          for x in j["paired_real_moea"]:
              print("optimizer seed",x["optimizer_seed"],
                    "old Q",x["original_historical_Q_CLOSENESS"],
                    "alternate Q",x["Q_by_candidate"],
                    "new-null vs old-null",x["outward_null_vs_old_null_Q_difference"])
          PY
      - name: Official GT, baseline and report immutability
        run: |
          git diff --exit-code -- \
            moeabench/diagnostics/resources/baselines_v0.14.0.json \
            moeabench/diagnostics/resources/references \
            calibration/audit_report.html
      - name: Archive noncertified DPF5 comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue83-dpf5-corrected-half-blur-real-Q-noncertified
          path: /tmp/issue83-dpf5-corrected-outward-paired-q.json
          if-no-files-found: warn
