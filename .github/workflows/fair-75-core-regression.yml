# Temporary validation for issue #75 core-only split; remove before merge.
name: FAIR issue 75 core-only regression

on:
  push:
    branches:
      - fix/75-fair-core
  workflow_dispatch:

jobs:
  core-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Execute scoped FAIR scientific-oracle tests
        run: |
          python -m pytest -q \
            tests/unit/test_fair_conformance_issue75.py \
            tests/unit/test_headway_anchors_issue75.py \
            tests/unit/test_headway_pointwise_issue75.py \
            tests/unit/test_nsga2_seed_issue75.py \
            tests/unit/test_dtlz_hypersphere_sampling.py \
            tests/integration/test_example13_consistency.py
      - name: Execute complete unit suite
        run: python test.py --unit
      - name: Prepare genuine fixture archives for integration tests
        run: |
          python - <<'PY'
          import moeabench as mb
          from pathlib import Path
          for algorithm,name in [
              (mb.moeas.NSGA2,"example_full_exp1.zip"),
              (mb.moeas.NSGA3,"example_full_exp2.zip"),
          ]:
              exp=mb.experiment(
                  mop=mb.mops.DTLZ2(M=3),
                  moea=algorithm(population=32,generations=8,seed=17),
              )
              exp.run(repeat=3,silent=True)
              exp.save(str(Path("examples")/name))
          PY
      - name: Execute basic integration
        run: python test.py --integration --basic
      - name: Verify no official scientific artifacts were changed
        run: |
          git diff --exit-code -- \
            moeabench/diagnostics/resources/baselines_v0.14.0.json \
            calibration/audit_report.html
          git status --short
