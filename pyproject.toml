[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moeabench"
version = "1.0.0"
authors = [
  { name = "Silva F. F.", email = "fernandoferreira.silva42@usp.br" },
  { name = "Monaco F. J.", email = "monaco@usp.br" },
]
description = "A comprehensive Multi-Objective Evolutionary Algorithm Benchmark library."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pymoo>=0.6.2",
    "moocore>=0.3.2",
    "ipywidgets>=8.1.9",
    "plotly>=5.22.0",
    "ipython>=9.18.1",
    "pandas>=3.0.6",
    "ordered_set>=4.1.0",
    "deap>=1.4.4",
    "deepdiff>=9.1.0",
    "PyGithub>=2.10.0",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "tqdm>=4.70.1",
    "scipy>=1.18.1",
    "matplotlib>=3.11.2",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["moeabench*"]

[tool.setuptools.package-data]
"moeabench" = ["requirements.txt", "resources/*.json", "resources/certifications/*.json", "resources/certifications/*/*.json"]
