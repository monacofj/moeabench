name: "Issue 106 - Run formal 0.18.0 reference certification"

on:
  push:
    branches:
      - release/0.18.0-certification

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NPY_DISABLE_CPU_FEATURES: X86_V4
      OPENBLAS_CORETYPE: HASWELL
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - name: Install the exact approved numerical reference stack
        run: |
          python -m pip install -e . pytest
          python -m pip install "numpy==2.5.4" "scipy==1.18.1" "pymoo==0.6.2" "deap==1.4.4" "moocore==0.3.2" "pandas==3.0.6" threadpoolctl
      - name: Check release candidate version before certification
        run: |
          python - <<'PY'
          import moeabench as mb
          from moeabench.environment_verification import snapshot
          print(snapshot())
          assert mb.system.version(show=False) == "0.18.0"
          assert snapshot()["moeabench"] == "0.18.0"
          PY
      - name: Preflight -- verify effective NumPy and OpenBLAS kernels
        run: python scripts/check_numerical_reference_runtime.py
      - name: Run independently complete basic suite
        run: python test.py --basic
      - name: Run ACTUAL certification (repeats complete basic suite)
        run: python test.py --certify
      - name: Verify new manifest and expose the complete exact generated JSON
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from moeabench.environment_verification import snapshot
          path = Path("moeabench/resources/certified_environment.json")
          doc = json.loads(path.read_text(encoding="utf-8"))
          assert doc["schema"] == 1
          assert doc["versions"] == snapshot()
          assert doc["versions"]["moeabench"] == "0.18.0"
          assert doc["description"] == "Developer-certified dependency versions after a complete basic suite."
          print("CERTIFIED_MANIFEST_BEGIN")
          print(path.read_text(encoding="utf-8").rstrip())
          print("CERTIFIED_MANIFEST_END")
          PY
      - name: Preserve certified artifact and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue106-certification-evidence
          path: |
            moeabench/resources/certified_environment.json
            docs/test.md
          if-no-files-found: error
