name: Issue 119 post-fix quantitative GT audit

on:
  pull_request:
    paths:
      - ".github/workflows/gt-postfix-issue119.yml"
      - "scripts/audit/gt_postfix_quantitative_issue119.py"
      - "tests/unit/test_gt_postfix_quantitative_issue119.py"
      - "docs/research/gt-issue119/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postfix-gt-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and scientific test dependencies
        run: python -m pip install -e . pytest
      - name: Independently verify report invariants
        run: python -m pytest -q tests/unit/test_gt_postfix_quantitative_issue119.py
      - name: Collect all 12 MOPs at 128, 512 and historical GT budgets
        run: |
          python -m scripts.audit.gt_postfix_quantitative_issue119 \
            --objectives 3 5 \
            --budgets 128 512 \
            --large-budget > gt-postfix-quantitative.json
          python - <<'PY'
          import json
          a = json.load(open("gt-postfix-quantitative.json"))
          assert a["schema"] == "moeabench_issue119_postfix_finite_gt_v1"
          assert len(a["records"]) == 72, len(a["records"])
          for r in a["records"]:
              assert r["ps_reproducible"], r
              assert r["budget_actual"] == r["budget_requested"], r
              assert r["unique_objectives"] == r["budget_requested"], r
              if r["geometry_residual"] is not None:
                  assert r["geometry_residual"] < 1e-10, r
              if r["region_occupancy"] is not None:
                  assert r["region_occupancy"]["invalid_record_rows"] == 0, r
              print("MOP_GT_AUDIT", r["problem"], "M", r["M"],
                    "requested", r["budget_requested"],
                    "unique", r["unique_objectives"],
                    "elapsed_s", round(r["elapsed_seconds"], 5),
                    "geometry_residual", r["geometry_residual"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gt-postfix-quantitative-issue119
          path: gt-postfix-quantitative.json
          retention-days: 30
