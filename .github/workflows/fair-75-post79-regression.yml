# Temporary post-merge compatibility validation of FAIR #75 against DPF2/DTLZ7 #79.
name: FAIR core post issue79 compatibility

on:
  push:
    branches: [fix/75-fair-core]
  workflow_dispatch:

jobs:
  post-79-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - name: Install working branch and testing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Reverify FAIR and repaired analytical PFs together
        run: |
          python -m pytest -q \
            tests/unit/test_fair_conformance_issue75.py \
            tests/unit/test_headway_anchors_issue75.py \
            tests/unit/test_headway_pointwise_issue75.py \
            tests/unit/test_nsga2_seed_issue75.py \
            tests/unit/test_dtlz_hypersphere_sampling.py \
            tests/unit/test_stage_closeness_adr0037.py \
            tests/unit/test_audit_pf_sources_issue75.py \
            tests/unit/test_dtlz7_dpf2_pareto_sources_issue78.py \
            tests/integration/test_example13_consistency.py
      - name: Full unit suite
        run: python test.py --unit
      - name: Regenerate legitimate fixtures for basic integration
        run: |
          python - <<'PY'
          import moeabench as mb
          from pathlib import Path
          for algorithm,name in [
              (mb.moeas.NSGA2,"example_full_exp1.zip"),
              (mb.moeas.NSGA3,"example_full_exp2.zip"),
          ]:
              experiment=mb.experiment(
                  mop=mb.mops.DTLZ2(M=3),
                  moea=algorithm(population=32,generations=8,seed=17)
              )
              experiment.run(repeat=3,silent=True)
              experiment.save(str(Path("examples")/name))
          PY
      - name: Basic integration suite
        run: python test.py --integration --basic
      - name: Check immutable scientific references and report
        run: |
          git diff --exit-code -- \
            moeabench/diagnostics/resources/baselines_v0.14.0.json \
            moeabench/diagnostics/resources/references \
            calibration/audit_report.html
