name: Original DTLZ5 DTLZ6 complete radial range PF face proof (issue 175)

on:
  pull_request:
    paths:
      - "scripts/audit/dtlz56_full_radial_support_face.py"
      - "tests/unit/test_gt_dtlz56_full_radial_support_face_issue175.py"
      - ".github/workflows/gt-dtlz56-full-radial-face-175.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-full-radial-face:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - name: Replay full-radial strict support theorem and attack tests
        run: python -m pytest tests/unit/test_gt_dtlz56_full_radial_support_face_issue175.py -q
      - name: Independently replay both original exact continuous faces
        run: |
          python - <<'PY'
          import json
          from fractions import Fraction
          from scripts.audit.dtlz56_full_radial_support_face import (
              certify_full_radial_support_face,replay_full_radial_support_face)
          for problem in ("DTLZ5","DTLZ6"):
              d=certify_full_radial_support_face(problem=problem)
              assert replay_full_radial_support_face(d,problem=problem)
              assert d["whole_positive_g_pf"]=="unverified"
              assert d["scientific_certification"]=="unverified"
              for k in ("global_pf_strict_uniform_margin",
                        "continuous_to_exact_grid_raw_l2_upper"):
                  x=d[k]
                  value=Fraction(int(x["numerator_hex"],16),
                                 int(x["denominator_hex"],16))
                  assert value>0
                  print(problem,k,float(value))
              print(problem,"grid decisions",len(d["grid_decisions"]))
              print(problem,"certified subset only",d["restricted_angular_support_face_only"])
          PY
