name: "Issue 108 - certification lifecycle validation"
on:
  push:
    branches: [feat/108-certification-lifecycle]
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NPY_DISABLE_CPU_FEATURES: X86_V4
      OPENBLAS_CORETYPE: HASWELL
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - name: Install certified numerical stack
        run: |
          python -m pip install -e . pytest
          python -m pip install "numpy==2.5.4" "scipy==1.18.1" "pymoo==0.6.2" "deap==1.4.4" "moocore==0.3.2" "pandas==3.0.6" threadpoolctl
      - name: Check reference kernel profile
        run: python scripts/check_numerical_reference_runtime.py
      - name: Compile new code
        run: python -m compileall -q moeabench test.py tests/unit/test_certification_lifecycle.py
      - name: Exercise new independent protocol tests
        run: python -m pytest tests/unit/test_certification_lifecycle.py -v
      - name: Probe six full-budget 60-generation cases with all three metrics
        run: |
          python - <<'PY'
          import time
          import numpy as np
          import moeabench as mb
          from moeabench import certification as c
          for entry in c._default_cases():
              case = entry["id"]
              mop = getattr(mb.mops, entry["mop"])(**entry["mop_kwargs"])
              ref = c._reference_matrix(mop)
              front = np.asarray(ref["points"], dtype=float)
              start=time.monotonic()
              row=c._measure(entry, entry["seeds"][0], front)
              print("ISSUE108_FULL_CASE",case,row,"seconds",round(time.monotonic()-start,3),flush=True)
          PY
