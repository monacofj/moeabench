name: "Issue 108 - preserve historical GT oracles independent of retired audit"
on:
  push:
    branches: [feat/108-certification-lifecycle]
jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract only frozen values used by existing GT stability tests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src=json.loads(Path("tests/calibration_reference_audit_v0.13.2.json").read_text())
          names=["DTLZ8","DTLZ9","DTLZ2","DTLZ3","DTLZ4","DPF5"]
          output={"schema":1,"description":"Frozen GT geometry reference extracted without altering any historical point or threshold.","problems":{}}
          for name in names:
              points=src["problems"][name]["gt_points"]
              entry={"n_points":len(points)}
              if name in ("DTLZ8","DTLZ9","DPF5"):
                  entry["gt_points"]=points
              output["problems"][name]=entry
              print("ISSUE108_GT_EXTRACT_CASE",name,len(points),flush=True)
          print("ISSUE108_GT_EXTRACT_BEGIN",flush=True)
          print(json.dumps(output,sort_keys=True,separators=(",",":"),allow_nan=False),flush=True)
          print("ISSUE108_GT_EXTRACT_END",flush=True)
          PY
