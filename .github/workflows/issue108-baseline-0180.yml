name: "Issue 108 - capture immutable historical 0.18.0 performance baseline"
on:
  push:
    branches: [feat/108-certification-lifecycle]
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      NPY_DISABLE_CPU_FEATURES: X86_V4
      OPENBLAS_CORETYPE: HASWELL
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: tooling
      - uses: actions/checkout@v4
        with:
          ref: 0d3e66804351e23b93fb483ff25e178e06ef6e12
          path: source
      - name: Install only additive certification instrument on original certified source
        run: |
          cp tooling/moeabench/certification.py source/moeabench/certification.py
          cp tooling/test.py source/test.py
          cd source
          git diff --exit-code -- moeabench/core moeabench/moeas moeabench/mops moeabench/metrics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - name: Install certified numerical stack
        working-directory: source
        run: |
          python -m pip install -e . pytest
          python -m pip install "numpy==2.5.4" "scipy==1.18.1" "pymoo==0.6.2" "deap==1.4.4" "moocore==0.3.2" "pandas==3.0.6" threadpoolctl
      - name: Verify exact NumPy/OpenBLAS native profile
        working-directory: source
        run: python scripts/check_numerical_reference_runtime.py
      - name: Generate complete 384-run first reference from original 0.18.0 source
        working-directory: source
        run: |
          python test.py --record-performance-baseline --output ../reference-0180-candidate.json
      - name: Audit complete reference provenance and report statistics
        working-directory: source
        run: |
          python - <<'PY'
          import json, pathlib, statistics
          from moeabench.certification import load_performance_reference, CASES, _hash_file
          path=pathlib.Path("../reference-0180-candidate.json")
          ref=load_performance_reference(path,require_approved=False)
          assert ref["status"]=="CANDIDATE_REQUIRES_REVIEW"
          assert ref["source_revision"]=="0d3e66804351e23b93fb483ff25e178e06ef6e12"
          assert len(ref["cases"])==len(CASES)==6
          for case in ref["cases"]:
              vals=[x["igdplus"] for x in case["observations"]]
              assert len(vals)==64
              print("ISSUE108_BASELINE_AUDIT",case["id"],"n",len(vals),
                    "mean",statistics.mean(vals),"sd",statistics.stdev(vals),
                    "min",min(vals),"max",max(vals),flush=True)
          print("ISSUE108_BASELINE_SHA256",_hash_file(path),flush=True)
          print("ISSUE108_REFERENCE_BEGIN",flush=True)
          print(path.read_text().rstrip(),flush=True)
          print("ISSUE108_REFERENCE_END",flush=True)
          PY
      - name: Upload candidate reference for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue108-historical-0180-reference-candidate
          path: reference-0180-candidate.json
          if-no-files-found: warn
          retention-days: 90
