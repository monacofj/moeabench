name: Compare pre-FAIR-cleanup and hotfix core semantics
on:
  push:
    branches: [hotfix/0.17.0-contract-recovery]
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout hotfix
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Checkout frozen pre-cleanup commit
        uses: actions/checkout@v4
        with:
          ref: 0f51689807680cc07aeac80e4da6a542e92cd696
          path: baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ./candidate
      - name: Probe historical implementation
        run: PYTHONPATH="$GITHUB_WORKSPACE/baseline" python candidate/scripts/audit/core_probe.py --out baseline-core.json
      - name: Probe cleanup hotfix
        run: PYTHONPATH="$GITHUB_WORKSPACE/candidate" python candidate/scripts/audit/core_probe.py --out candidate-core.json
      - name: Compare frozen observations
        run: python candidate/scripts/audit/compare_core_probe.py baseline-core.json candidate-core.json
      - name: Upload auditable results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-compatibility-observations
          path: '*-core.json'
