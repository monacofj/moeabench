name: Stability verification separation

on:
  pull_request:
    branches:
      - main
      - hotfix/0.17.0-contract-recovery
      - tests/unit-contract-consolidation
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and test dependencies
        run: python -m pip install -e . pytest
      - name: Check source compilation
        run: python -m compileall -q moeabench tests test.py
      - name: Check explicit stability separation contracts
        run: python -m pytest tests/unit/test_stability_separation_contract.py -q
      - name: Verify frozen values independently with Python standard-library geometry
        run: python scripts/audit/verify_conventional_metric_references.py
      - name: Check fixed conventional metric numerical references (#97)
        run: python -m pytest tests/test_stability_metrics.py -q
      - name: Run complete unit scope
        run: python test.py --unit
      - name: Check performance measurement adapter with a real small run
        run: python -m pytest tests/integration/test_performance_measurement_adapter.py -q
      - name: Verify numerical smoke references
        run: python test.py --numeric-stability --smoke

  reference-numeric-stability:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - name: Install pinned reference numerical stack
        run: |
          python -m pip install -e . pytest
          python -m pip install "numpy==2.5.4" "scipy==1.18.1" "pymoo==0.6.2" "deap==1.4.4" "moocore==0.3.2" "pandas==3.0.6"
      - name: Check numerical dependencies against reference manifest
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys
          import importlib.metadata as im

          expected = json.loads(
              pathlib.Path("moeabench/resources/certified_environment.json").read_text()
          )["versions"]
          assert sys.version.split()[0] == expected["python"]
          for name in ("numpy", "scipy", "pymoo", "deap", "moocore", "pandas"):
              assert im.version(name) == expected[name], (
                  name, im.version(name), expected[name]
              )
          PY
      - name: Verify entire numerical basic suite (known NSGA3 x DPF1 failure tracked in issue 92)
        run: python test.py --numeric-stability --basic
