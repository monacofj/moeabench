# Temporary follow-up for issue78 continuous parameter-PF Q sensitivity.
name: Issue78 DPF5 independent continuous reference real Q

on:
  push:
    branches: [research/78-dpf5-measure-sensitivity]
  workflow_dispatch:

jobs:
  independent-Q:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Unit tests for exact source and independent DPF5 law
        run: |
          python -m pytest -q \
            tests/unit/test_dpf5_independent_pf_issue78.py \
            tests/unit/test_dpf5_frozen_gt_measure_issue78.py \
            tests/unit/test_dpf5_measure_sensitivity_issue78.py
      - name: Pair real NSGA-II runs with noncertified continuous PF reference
        timeout-minutes: 10
        run: |
          python calibration/scripts/study_dpf5_paired_q_issue78.py \
            --K 100 --generations 300 \
            --seed 1 --seed 7 \
            --continuous-samples 16384 --reference-seed 123 \
            --output /tmp/issue78-dpf5-continuous-paired-q.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/issue78-dpf5-continuous-paired-q.json').read_text())
          assert r['status']=='NONCERTIFIED_DPF5_REAL_MOEA_PAIRED_Q_SENSITIVITY'
          assert r['reference_sampling_law']=='independent_iid_uniform_decision_parameters'
          assert r['continuous_samples']==16384 and r['reference_seed']==123
          assert not r['certified'] and not r['baseline_files_modified']
          assert r['changed_only_closeness_in_memory']
          assert r['all_other_metrics_unchanged']
          assert len(r['runs'])==2
          assert all(set(x['counterfactuals'])==
                     {'continuous_iid_decision_pushforward'} for x in r['runs'])
          assert all(x['P0_sha256'] and x['Pf_sha256'] and x['GT_sha256']
                     for x in r['runs'])
          print('Genuine real-MOEA continuous law epsilon:',
                r['law_epsilons']['continuous_iid_decision_pushforward'])
          print('Max absolute Q shift vs historical:',
                r['maximum_abs_q_shift_from_historical'])
          PY
      - name: No scientific artifact modification
        run: |
          git diff --exit-code -- \
            moeabench/diagnostics/resources/baselines_v0.14.0.json \
            moeabench/diagnostics/resources/references \
            calibration/audit_report.html
      - name: Archive scientific pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue78-dpf5-independent-continuous-PF-real-Q-not-certified
          path: /tmp/issue78-dpf5-continuous-paired-q.json
          if-no-files-found: warn
