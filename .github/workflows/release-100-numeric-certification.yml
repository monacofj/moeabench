name: Issue 119 release candidate numeric certification

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "moeabench/system.py"
      - ".github/workflows/release-100-numeric-certification.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "moeabench/system.py"
      - "tests/unit/test_release_version_consistency_issue119.py"
      - ".github/workflows/release-100-numeric-certification.yml"
      - "docs/research/gt-issue119/release-100-certification-candidate.md"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  numeric-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NPY_DISABLE_CPU_FEATURES: X86_V4
      OPENBLAS_CORETYPE: HASWELL
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - name: Install the approved numerical dependency versions
        run: |
          python -m pip install -e . pytest
          python -m pip install "numpy==2.5.4" "scipy==1.18.1" "pymoo==0.6.2" "deap==1.4.4" "moocore==0.3.2" "pandas==3.0.6" threadpoolctl
      - name: Verify candidate version and approved historical reference
        run: |
          python - <<'PY'
          import importlib.metadata as im
          import json
          from pathlib import Path
          import moeabench as mb
          import moeabench.certification as cert
          assert im.version("moeabench") == "1.0.0"
          assert mb.system.version(show=False) == "1.0.0"
          path=Path("moeabench/resources/certifications/0.18.0/performance-reference.json")
          old=cert.load_performance_reference(path)
          assert old["status"] == "APPROVED"
          assert old["source_revision"] == "0d3e66804351e23b93fb483ff25e178e06ef6e12"
          assert len(old["cases"]) == 6
          assert sum(len(c["observations"]) for c in old["cases"]) == 384
          assert not Path("moeabench/resources/certifications/1.0.0/numeric-certificate.json").exists()
          print("Approved 0.18.0 reference intact; 1.0.0 candidate slot free")
          PY
      - name: Prepare required deterministic integration archives
        run: |
          python - <<'PY'
          from pathlib import Path
          import moeabench as mb
          for algorithm, filename in (
              (mb.moeas.NSGA2, "example_full_exp1.zip"),
              (mb.moeas.NSGA3, "example_full_exp2.zip"),
          ):
              path = Path("examples") / filename
              if path.exists():
                  continue
              experiment=mb.experiment(
                  mop=mb.mops.DTLZ2(M=3),
                  moea=algorithm(population=32, generations=8, seed=17),
              )
              experiment.run(repeat=3, silent=True)
              experiment.save(str(path))
          PY
      - name: Verify the actual reference ufunc/BLAS kernels
        run: python scripts/check_numerical_reference_runtime.py
      - name: Certify full basic suite for this exact candidate revision
        run: python test.py --certify-numeric
      - name: Verify certificate source, version and historical reference integrity
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import moeabench.certification as cert
          certificate=Path("moeabench/resources/certifications/1.0.0/numeric-certificate.json")
          data=json.loads(certificate.read_text())
          assert data["schema"] == "moeabench-numeric-certificate"
          assert data["version"] == "1.0.0"
          assert data["source_revision"] == os.environ["GITHUB_SHA"]
          assert data["counts"] == {"suite": "basic", "status": "PASSED"}
          assert data["evidence_url"].endswith(os.environ["GITHUB_RUN_ID"])
          reference=cert.load_performance_reference(
              "moeabench/resources/certifications/0.18.0/performance-reference.json")
          assert reference["status"] == "APPROVED"
          print("CANDIDATE_NUMERIC_CERTIFICATE", data["source_revision"],
                "fixture_hashes", len(data["numerical_fixtures_sha256"]))
          PY
      - name: Upload unmerged, source-bound certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-100-numeric-candidate
          if-no-files-found: error
          retention-days: 90
          path: |
            moeabench/resources/certifications/1.0.0/numeric-certificate.json
            moeabench/resources/certified_environment.json
      - name: Record verified main numerical certificate on issue 119
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 119 --repo "$GITHUB_REPOSITORY" --body \
            "Numeric 1.0.0 certification **PASSED** for final main source SHA \`$GITHUB_SHA\`. The formal basic suite, approved numerical runtime and frozen fixture digest checks passed. Source-bound evidence: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (artifact: release-100-numeric-candidate). This does not automatically launch performance certification or publish a release."
