name: DTLZ6 original dominated selected scalarization provenance (issue 213)

on:
  pull_request:
    paths:
      - "scripts/audit/dtlz6_original_selected_scalarization_trace.py"
      - "tests/unit/test_gt_dtlz6_original_scalarization_trace_issue213.py"
      - ".github/workflows/gt-dtlz6-original-scalarization-trace-213.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-scalarized-reconstruction-trace:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - name: Replay original source 448 candidates and selected row provenance
        run: python -m pytest tests/unit/test_gt_dtlz6_original_scalarization_trace_issue213.py -q
      - name: Archive actual original scalarizer active-set data
        run: |
          python -m scripts.audit.dtlz6_original_selected_scalarization_trace \
            --report dtlz6-original-dominated-n16-scalarization-trace.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path(
              "dtlz6-original-dominated-n16-scalarization-trace.json"
          ).read_text())
          assert d["source_candidate_count"]==448
          assert d["selected_count"]==16
          assert d["known_independently_dominated_selected_indices"]==[7,11]
          assert d["whole_gt_membership"]=="rejected_by_independent_exact_proof"
          assert d["causal_repair_of_sampler"]=="unverified"
          assert all(r["scalarization_candidate_index"] is not None
              for r in d["specific_provenance_rows"])
          print("Source-scientific diagnosis only, no production mutation")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dtlz6-original-domination-active-set-provenance
          path: dtlz6-original-dominated-n16-scalarization-trace.json
          if-no-files-found: warn
