name: Issue 119 explicitly authorized performance certification

# No link to the numerical-certification workflow. Performance starts
# only on an explicit PR label, never on numerical success or failure.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  actions: read

jobs:
  performance:
    if: github.event.label.name == 'certify-performance-119'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      NPY_DISABLE_CPU_FEATURES: X86_V4
      OPENBLAS_CORETYPE: HASWELL
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - name: Install the approved numerical environment
        run: |
          python -m pip install -e . pytest
          python -m pip install "numpy==2.5.4" "scipy==1.18.1" "pymoo==0.6.2" "deap==1.4.4" "moocore==0.3.2" "pandas==3.0.6" threadpoolctl
      - name: Locate a separately completed matching numeric run
        id: evidence
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["PR_HEAD_SHA"]
          response = subprocess.check_output([
              "gh", "api", f"repos/{repo}/actions/runs",
              "-f", f"head_sha={sha}", "-f", "status=success",
              "-f", "per_page=100"
          ], text=True)
          runs = json.loads(response)["workflow_runs"]
          matching = [
              run for run in runs
              if run["name"] == "Issue 119 release candidate numeric certification"
              and run["conclusion"] == "success"
              and run["head_sha"] == sha
              and run["event"] == "pull_request"
          ]
          for run in sorted(matching, key=lambda r: r["id"], reverse=True):
              a = subprocess.check_output([
                  "gh", "api", f"repos/{repo}/actions/runs/{run['id']}/artifacts"
              ], text=True)
              artifacts = json.loads(a)["artifacts"]
              if any(x["name"] == "release-100-numeric-candidate"
                     and not x["expired"] for x in artifacts):
                  with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                      print(f"run_id={run['id']}", file=out)
                  print("Verified independently completed numeric workflow:", run["id"])
                  break
          else:
              sys.exit("No separately successful, unexpired candidate numeric artifact")
          PY
      - name: Download numeric certificate, without regenerating it
        uses: actions/download-artifact@v4
        with:
          name: release-100-numeric-candidate
          run-id: ${{ steps.evidence.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .
      - name: Enforce certificate revision/environment and frozen baseline
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import moeabench.certification as cert
          import moeabench.environment_verification as ev
          import moeabench.system as system
          assert system.version(show=False) == "1.0.0"
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"],
                                        text=True).strip()
          assert sha == os.environ["GITHUB_SHA"], (sha, os.environ["GITHUB_SHA"])
          numeric = cert.require_current_numeric_certificate()
          assert numeric["source_revision"] == sha
          assert numeric["counts"] == {"suite": "basic", "status": "PASSED"}
          assert ev.verify_version(force=True)["status"] == "MATCH"
          historical = cert.load_performance_reference(
              "moeabench/resources/certifications/0.18.0/performance-reference.json")
          assert len(historical["cases"]) == 6
          assert sum(len(c["observations"]) for c in historical["cases"]) == 384
          assert historical["source_revision"] == "0d3e66804351e23b93fb483ff25e178e06ef6e12"
          print("Frozen source", sha, "numeric evidence",
                numeric.get("evidence_url"), "performance baseline approved")
          PY
      - name: Explicit separate performance certification against immutable 0.18.0
        run: |
          set -o pipefail
          python test.py --certify-performance \
            --reference moeabench/resources/certifications/0.18.0/performance-reference.json \
            --output moeabench/resources/certifications/1.0.0/performance-vs-0.18.0.json \
            | tee performance-certification.log
      - name: Archive all evidence, including NOT_CERTIFIED outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-100-performance-vs-0180
          retention-days: 90
          if-no-files-found: warn
          path: |
            performance-certification.log
            moeabench/resources/certifications/1.0.0/performance-vs-0.18.0.json
