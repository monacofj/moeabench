name: JOSS cleanup validation
on:
  push:
    branches: [chore/joss-remove-fair]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - name: Syntax validation
        run: python -m compileall -q moeabench tests examples
      - name: Collect all tests
        run: python -m pytest tests --collect-only -q
      - name: Full unit tests
        run: python test.py --unit
      - name: Basic integration tests
        run: python test.py --integration --basic
      - name: Numerical smoke tests
        run: python test.py --stability --smoke
      - name: Check installed-package verification and absolute HV
        run: |
          python - <<'PY'
          import numpy as np
          import moeabench as mb
          assert not hasattr(mb, 'clinic')
          ref = np.array([[0.0, 1.0], [1.0, 0.0], [0.4, 0.4]])
          front = np.array([[0.2, 0.8], [0.8, 0.2], [0.45, 0.45]])
          h = mb.metrics.hv(front, ref=ref, scale='abs', progress=False)
          assert np.isfinite(float(h))
          assert mb.system.verify_version(show=False)['status'] in ('MATCH', 'MISMATCH', 'UNCONFIGURED')
          PY
