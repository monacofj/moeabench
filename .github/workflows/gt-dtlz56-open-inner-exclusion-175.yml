name: DTLZ56 positive-g open-angular exclusion theorem (issue 175)

on:
  pull_request:
    paths:
      - "scripts/audit/dtlz56_open_inner_angle_exclusion.py"
      - "tests/unit/test_gt_dtlz56_open_inner_angle_exclusion_issue175.py"
      - ".github/workflows/gt-dtlz56-open-inner-exclusion-175.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-open-inner-exclusion:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - name: Replay exact positive-g open-inner exclusion theorem
        run: python -m pytest tests/unit/test_gt_dtlz56_open_inner_angle_exclusion_issue175.py -q
      - name: Demonstrate strict same-ray construction and noncertification of boundary
        run: |
          python - <<'PY'
          from fractions import Fraction
          from scripts.audit.dtlz56_open_inner_angle_exclusion import (
              certify_open_inner_angle_exclusion,replay_open_inner_angle_exclusion)
          from scripts.audit.dtlz56_exact_same_ray import _decode
          for problem,g in (("DTLZ5",Fraction(1,8)),
                            ("DTLZ6",Fraction(3,5))):
              u=(Fraction(1,3),Fraction(1,4),Fraction(3,4))
              result=certify_open_inner_angle_exclusion(
                  u,g=g,problem=problem,k=1)
              assert replay_open_inner_angle_exclusion(
                  u,result,g=g,problem=problem,k=1)
              w=result["same_ray_exact_dominator"]
              assert _decode(w["objective_scale"])<1
              boundary=certify_open_inner_angle_exclusion(
                  (u[0],Fraction(1),u[2]),g=g,problem=problem,k=1)
              assert boundary["conclusion"]=="unverified"
              assert result["whole_pf_completeness"]=="unverified"
              print(problem,"exact same-ray ratio",
                    float(_decode(w["objective_scale"])))
          PY
