name: DTLZ5 DTLZ6 exact continuous g0 curve coverage proof (issue 175)

on:
  pull_request:
    paths:
      - "scripts/audit/dtlz56_gzero_continuous_cover.py"
      - "tests/unit/test_gt_dtlz56_gzero_continuous_cover_issue175.py"
      - ".github/workflows/gt-dtlz56-gzero-continuous-cover-175.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-gzero-component-proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - name: Independently validate rational component-cover theorem
        run: python -m pytest tests/unit/test_gt_dtlz56_gzero_continuous_cover_issue175.py -q
      - name: Recompute and replay both original component certificates
        run: |
          python - <<'PY'
          import json
          from scripts.audit.dtlz56_gzero_continuous_cover import (
              certify_gzero_curve_cover,replay_gzero_curve_cover)
          for problem,tail in (("DTLZ5",.5),("DTLZ6",0.)):
              anchors=[(x,.5,.5,tail) for x in (0.,1/3,2/3,1.)]
              proof=certify_gzero_curve_cover(anchors,problem=problem)
              assert replay_gzero_curve_cover(anchors,proof,problem=problem)
              assert proof["whole_gt_coverage"]=="unverified"
              print(json.dumps(proof,sort_keys=True))
          PY
